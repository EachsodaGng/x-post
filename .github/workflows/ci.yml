name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Verify CLI Commands
        run: |
          bun ./bin/x-post.js --help
          bun ./scripts/x-browser.ts --help
          bun ./scripts/x-video.ts --help
          bun ./scripts/x-quote.ts --help
          bun ./scripts/x-article.ts --help
          bun ./scripts/x-translate-video.ts --help
          bun ./scripts/copy-to-clipboard.ts --help
          bun ./scripts/paste-from-clipboard.ts --help
          bun ./scripts/md-to-html.ts --help

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate SKILL.md Frontmatter & Structure
        run: |
          python3 -c "
          import re, sys
          content = open('SKILL.md').read()
          assert content.startswith('---'), 'Missing YAML frontmatter start'
          assert 'name: x-post' in content, 'Missing correct name in frontmatter'
          assert 'description:' in content, 'Missing description'
          print('✅ SKILL.md validation passed!')
          "
